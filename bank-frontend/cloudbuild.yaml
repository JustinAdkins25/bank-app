steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'build',
      '--build-arg',
      'REACT_APP_API_URL=https://adkins-bank-backend-524103119199.us-central1.run.app/api',
      '-t',
      'us-central1-docker.pkg.dev/$PROJECT_ID/adkins-bank-app/frontend',
      '.'
    ]
  dir: 'bank-frontend'

- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'push',
      'us-central1-docker.pkg.dev/$PROJECT_ID/adkins-bank-app/frontend'
    ]

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    [
      'run',
      'deploy',
      'adkins-bank-frontend',
      '--image',
      'us-central1-docker.pkg.dev/$PROJECT_ID/adkins-bank-app/frontend',
      '--region',
      'us-central1',
      '--platform',
      'managed',
      '--allow-unauthenticated'
    ]

options:
  logging: CLOUD_LOGGING_ONLY


